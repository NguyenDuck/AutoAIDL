plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = "io.github.nguyenduck"
version = "1.0.6"

repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()

    implementation "com.github.javaparser:javaparser-core:3.25.8"
}

gradlePlugin {
    plugins {
        autoAidl {
            id = "io.github.nguyenduck.autoaidl"
            implementationClass = "io.github.nguyenduck.AutoAidlPlugin"
        }
    }
}

publishing {
    publications {
        pluginMaven(MavenPublication) {
            artifactId = "autoaidl"
        }
    }

    repositories {
        maven {
            name = "GithubPackages"
            url = uri("https://maven.pkg.github.com/NguyenDuck/AutoAIDL")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USER")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}